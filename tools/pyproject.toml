[project]
name = "openprose-tools"
version = "0.1.0"
description = "Deterministic verification tooling for OpenProse runs (receipts, inspect)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pydantic>=2.7"]

[project.scripts]
openprose-tools = "openprose_tools.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "pyrefly>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openprose_tools"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["src", "tests"]
